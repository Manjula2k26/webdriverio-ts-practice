name: WebdriverIO Tests

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select test environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - qa

      browser:
        description: 'Select browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox

      suite:
        description: 'Select test suite'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

jobs:
  test:
    runs-on: windows-latest

    env:
       TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'test' }}
       TEST_BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'firefox' }}
       TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'regression' }}

    steps:

      - name: Display selected configuration
        shell : powershell
        run: |
         echo Environment: $env:TEST_ENV
         echo Browser: $env:TEST_BROWSER
          if ("${{ github.event_name }}" -eq "push") {
            echo Test Suite: regression
            echo Trigger: Automatic push
          }
          else {
            echo Test Suite: $env:TEST_SUITE
            echo Trigger: Manual
          }
         
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run WebdriverIO tests
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            npm run test:regression
          }
          else {
            npm run test:${{ inputs.suite }}
          }

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore